{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="container-xxl py-5">
    <div class="container">
        <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
            <h6 class="section-title bg-white text-center text-primary px-3">Profile</h6>
            <h1 class="mb-5">Edit Profile</h1>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-8 wow fadeInUp" data-wow-delay="0.3s">
                <div class="bg-light p-5 rounded">
                    {% if message %}
                    <div class="alert alert-success">{{ message }}</div>
                    {% endif %}
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="fullname" name="fullname"
                                        placeholder="Full Name" value="{{ user.fullname }}" required>
                                    <label for="fullname">Full Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                                        value="{{ user.email }}" required>
                                    <label for="email">Email</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone"
                                        value="{{ user.phone }}">
                                    <label for="phone">Phone</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" placeholder="Bio" id="bio" name="bio"
                                        style="height: 150px">{{ user.bio }}</textarea>
                                    <label for="bio">Bio</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100 py-3" type="submit">Update Profile</button>
                            </div>
                            <div class="col-12 text-center mt-3">
                                <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary">Back to
                                    Dashboard</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
