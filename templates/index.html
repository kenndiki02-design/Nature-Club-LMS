<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Club Editorial — Karatina University</title>
    <meta name="description" content="The editorial department of Karatina University Nature Club — courses in videography, photography, graphic design, web design and development, and master classes.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* ============================================
           CSS VARIABLES & THEME TOKENS
        ============================================ */
        :root {
            --forest: #1b4332;
            --forest-dark: #0f2a1e;
            --forest-light: #2d6a4f;
            --sage: #40916c;
            --mint: #52b788;
            --lime: #74c69d;
            --earth: #d4a373;
            --sand: #f4e8c1;
            --cream: #f8f9f4;
            --white: #ffffff;
            --dark: #1a1a2e;
            --text: #2d3142;
            --text-muted: #6b7280;
            --border: #d1e7dd;
            --shadow: rgba(27,67,50,0.12);
            --shadow-lg: rgba(27,67,50,0.25);
            --gradient-hero: linear-gradient(135deg, #0f2a1e 0%, #1b4332 50%, #2d6a4f 100%);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --cream: #0f1a14;
            --white: #1a2d22;
            --text: #e8f5e9;
            --text-muted: #9ab8a0;
            --border: #2d4a38;
            --shadow: rgba(0,0,0,0.4);
            --shadow-lg: rgba(0,0,0,0.6);
        }

        /* ============================================
           RESET & BASE
        ============================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); line-height: 1.6; transition: var(--transition); }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; height: auto; }

        /* ============================================
           UTILITY CLASSES
        ============================================ */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 50px;
            font-weight: 600; font-size: 0.9rem;
            cursor: pointer; border: none; transition: var(--transition);
            text-decoration: none; letter-spacing: 0.4px;
        }
        .btn-primary { background: var(--forest); color: var(--white); box-shadow: 0 4px 15px rgba(27,67,50,0.35); }
        .btn-primary:hover { background: var(--forest-light); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(27,67,50,0.45); }
        .btn-outline { background: transparent; color: var(--forest); border: 2px solid var(--forest); }
        .btn-outline:hover { background: var(--forest); color: var(--white); transform: translateY(-2px); }
        .btn-white { background: var(--white); color: var(--forest); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .btn-white:hover { background: var(--cream); transform: translateY(-2px); }
        .btn-sm { padding: 8px 18px; font-size: 0.82rem; }
        .btn-ghost-light { background: transparent; color: var(--white); border: 2px solid rgba(255,255,255,0.4); }
        .btn-ghost-light:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-orange { background: #fed7aa; color: #9a3412; }
        .badge-purple { background: #ede9fe; color: #5b21b6; }

        .section-label {
            display: inline-block; background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--forest); padding: 6px 18px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 16px;
        }
        .section-title {
            font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 16px;
        }
        .section-subtitle { font-size: 1rem; color: var(--text-muted); max-width: 580px; margin: 0 auto; }

        .text-center { text-align: center; }
        .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; } .mt-4 { margin-top: 32px; } .mt-5 { margin-top: 48px; }
        .mb-2 { margin-bottom: 16px; } .mb-3 { margin-bottom: 24px; } .mb-4 { margin-bottom: 32px; }
        .grid { display: grid; gap: 24px; }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

        .progress-bar-wrap { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sage), var(--mint)); transition: width 1.2s ease; }
        [data-theme="dark"] .progress-bar-wrap { background: rgba(255,255,255,0.1); }

        /* ============================================
           NAVBAR
        ============================================ */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(27,67,50,0.1); padding: 0 20px; height: 72px;
            display: flex; align-items: center; justify-content: space-between; transition: var(--transition);
        }
        [data-theme="dark"] .navbar { background: rgba(26,45,34,0.95); border-bottom-color: rgba(82,183,136,0.15); }
        .navbar-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-mark {
            width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--forest), var(--sage));
            display: flex; align-items: center; justify-content: center; color: var(--white);
            font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
        }
        .navbar-brand .brand-name { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--forest); line-height: 1.2; display: block; }
        .navbar-brand .brand-sub { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        [data-theme="dark"] .navbar-brand .brand-name { color: var(--mint); }

        .navbar-nav { display: flex; align-items: center; gap: 4px; list-style: none; }
        .nav-link { padding: 8px 14px; border-radius: 8px; color: var(--text); font-weight: 500; font-size: 0.86rem; transition: var(--transition); cursor: pointer; }
        .nav-link:hover, .nav-link.active { background: rgba(27,67,50,0.08); color: var(--forest); }
        [data-theme="dark"] .nav-link:hover, [data-theme="dark"] .nav-link.active { background: rgba(82,183,136,0.12); color: var(--mint); }

        .navbar-actions { display: flex; align-items: center; gap: 12px; }
        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(27,67,50,0.07); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--forest); transition: var(--transition);
        }
        .theme-toggle:hover { background: rgba(27,67,50,0.15); transform: rotate(20deg); }
        [data-theme="dark"] .theme-toggle { background: rgba(82,183,136,0.12); color: var(--mint); }

        .hamburger { display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 5px; padding: 4px; }
        .hamburger span { display: block; width: 24px; height: 2px; background: var(--forest); border-radius: 2px; transition: var(--transition); }
        [data-theme="dark"] .hamburger span { background: var(--mint); }

        @media (max-width: 980px) {
            .hamburger { display: flex; }
            .nav-menu {
                display: none; position: fixed; top: 72px; left: 0; right: 0; bottom: 0;
                background: var(--white); flex-direction: column; padding: 24px; gap: 8px; overflow-y: auto; z-index: 999;
            }
            [data-theme="dark"] .nav-menu { background: var(--dark); }
            .nav-menu.open { display: flex; }
            .navbar-nav { flex-direction: column; align-items: stretch; width: 100%; }
            .nav-link { padding: 12px 16px; border-radius: 10px; }
        }

        /* ============================================
           HERO SECTION
        ============================================ */
        .hero { min-height: 100vh; position: relative; overflow: hidden; display: flex; align-items: center; padding-top: 72px; }
        .hero-bg { position: absolute; inset: 0; background: var(--gradient-hero); }
        .hero-particles { position: absolute; inset: 0; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; background: rgba(82, 183, 136, 0.15); animation: float 6s ease-in-out infinite; }
        .particle:nth-child(1) { width: 80px; height: 80px; top: 15%; left: 8%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 50px; height: 50px; top: 70%; left: 6%; animation-delay: 1.5s; }
        .particle:nth-child(3) { width: 120px; height: 120px; top: 55%; left: 2%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding: 60px 0; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(82,183,136,0.2);
            border: 1px solid rgba(82,183,136,0.4); color: var(--lime); padding: 6px 18px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 20px;
        }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4.6vw, 3.4rem); color: var(--white); font-weight: 700; line-height: 1.18; margin-bottom: 20px; }
        .hero-title .highlight { color: var(--lime); font-style: italic; }
        .hero-subtitle { font-size: clamp(0.95rem, 1.6vw, 1.1rem); color: rgba(255,255,255,0.8); margin-bottom: 32px; max-width: 520px; }
        .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 48px; }

        .hero-stats { display: flex; gap: 36px; flex-wrap: wrap; }
        .hero-stat-number { font-size: 1.9rem; font-weight: 700; color: var(--lime); font-family: 'Playfair Display', serif; }
        .hero-stat-label { font-size: 0.78rem; color: rgba(255,255,255,0.65); margin-top: 2px; }

        .hero-visual { position: relative; height: 440px; }
        .float-card {
            position: absolute; background: var(--white); border-radius: 14px; padding: 14px 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 12px;
            animation: floatCard 4.5s ease-in-out infinite; width: 240px;
        }
        .float-card .fc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--white); flex-shrink: 0; }
        .float-card .fc-title { font-size: 0.85rem; font-weight: 700; color: var(--text); }
        .float-card .fc-sub { font-size: 0.75rem; color: var(--text-muted); }
        .fc-1 { top: 5%; left: 5%; animation-delay: 0s; }
        .fc-2 { top: 42%; right: 0; animation-delay: 1.2s; }
        .fc-3 { bottom: 4%; left: 12%; animation-delay: 2.4s; }

        @media (max-width: 980px) {
            .hero-grid { grid-template-columns: 1fr; text-align: center; }
            .hero-cta { justify-content: center; }
            .hero-stats { justify-content: center; }
            .hero-subtitle { margin-left: auto; margin-right: auto; }
            .hero-visual { height: 320px; margin-top: 20px; }
            .float-card { width: 200px; }
        }

        /* ============================================
           TOOLS STRIP
        ============================================ */
        .trusted-strip { background: var(--white); padding: 32px 0; border-bottom: 1px solid var(--border); }
        .trusted-label { text-align: center; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 18px; }
        .trusted-logos { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: center; }
        .trusted-logos span { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1rem; color: var(--text-muted); opacity: 0.8; }

        /* ============================================
           FEATURES / SPECIALISATIONS SECTION
        ============================================ */
        .features-section { padding: 80px 0; background: var(--cream); }
        .feature-card { padding: 30px; border-radius: var(--radius); background: var(--white); border: 1px solid var(--border); transition: var(--transition); display: flex; flex-direction: column; height: 100%; }
        .feature-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px var(--shadow-lg); border-color: var(--mint); }
        .feature-icon { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, var(--forest), var(--sage)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--white); margin-bottom: 18px; box-shadow: 0 8px 20px rgba(27,67,50,0.3); }
        .feature-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--forest); }
        .feature-card p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; flex-grow: 1; }
        .feature-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
        .feature-tags span { font-size: 0.72rem; font-weight: 600; background: var(--cream); color: var(--sage); padding: 4px 10px; border-radius: 12px; }
        .feature-link { font-size: 0.85rem; font-weight: 700; color: var(--forest); display: inline-flex; align-items: center; gap: 6px; }
        .feature-link:hover { color: var(--sage); gap: 10px; }

        /* ============================================
           COURSES SECTION
        ============================================ */
        .courses-section { padding: 80px 0; background: var(--white); }
        .course-card { background: var(--cream); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 20px var(--shadow); transition: var(--transition); }
        .course-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px var(--shadow-lg); }
        .course-img-wrap { position: relative; height: 170px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: rgba(255,255,255,0.9); }
        .course-badge-overlay { position: absolute; top: 12px; left: 12px; }
        .course-body { padding: 20px; }
        .course-category { font-size: 0.75rem; font-weight: 700; color: var(--sage); text-transform: uppercase; letter-spacing: 0.5px; }
        .course-title { font-size: 1rem; font-weight: 700; margin: 8px 0 10px; color: var(--text); line-height: 1.4; }
        .course-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; }
        .course-meta { display: flex; gap: 16px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 14px; }
        .course-meta span { display: flex; align-items: center; gap: 5px; }
        .rating-stars { color: #f59e0b; font-size: 0.8rem; }

        /* ============================================
           IMPACT SECTION
        ============================================ */
        .impact-section { padding: 80px 0; background: var(--gradient-hero); }
        .impact-header .section-label { background: rgba(82,183,136,0.2); color: var(--lime); }
        .impact-header .section-title { color: var(--white); }
        .impact-header .section-subtitle { color: rgba(255,255,255,0.7); }
        .impact-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: start; margin-top: 48px; }
        .impact-item { display: flex; gap: 14px; margin-bottom: 28px; }
        .impact-item .ii-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); margin-top: 8px; flex-shrink: 0; }
        .impact-item h4 { color: var(--white); font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
        .impact-item p { color: rgba(255,255,255,0.68); font-size: 0.88rem; line-height: 1.6; }

        .impact-panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius); padding: 28px; }
        .impact-counters { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
        .impact-counter-number { font-size: 1.7rem; font-weight: 700; color: var(--lime); font-family: 'Playfair Display', serif; }
        .impact-counter-label { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
        .impact-bar { margin-bottom: 18px; }
        .impact-bar-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
        .impact-panel .progress-bar-wrap { background: rgba(255,255,255,0.12); }

        @media (max-width: 900px) { .impact-grid { grid-template-columns: 1fr; } }
