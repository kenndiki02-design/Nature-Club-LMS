<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate - Karatina University Nature Club LMS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        :root {
            --primary-dark: #1b4332;
            --primary-main: #2d6a4f;
            --primary-light: #40916c;
            --secondary-light: #52b788;
            --accent: #74c69d;
            --bg-light: #f8f9f4;
            --earth-1: #c2a878;
            --earth-2: #8b5a2b;
            --text-dark: #2c3e50;
            --text-light: #f8f9f4;
            --danger: #e74c3c;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, #e9ecef 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Page Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(45, 106, 79, 0.2);
            border-top-color: var(--primary-main);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Navbar */
        header {
            background: rgba(27, 67, 50, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo img {
            height: 45px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transition: transform 0.3s;
        }
        .logo img:hover { transform: scale(1.05); }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }
        .btn-nav {
            background: var(--accent);
            color: var(--primary-dark);
            padding: 0.5rem 1.2rem;
            border-radius: 25px;
            font-weight: 600;
        }
        .btn-nav:hover { background: #8cdab4; color: var(--primary-dark); }

        /* Main Content */
        main {
            flex: 1;
            padding: 4rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.1rem;
            color: #555;
        }

        .search-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 2;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-main);
            font-size: 1.2rem;
        }
        .search-input {
            width: 100%;
            padding: 1.2rem 1.2rem 1.2rem 3.5rem;
            border: 2px solid rgba(45, 106, 79, 0.2);
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Inter', sans-serif;
        }
        .search-input:focus {
            border-color: var(--primary-main);
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-main), var(--primary-light));
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(45, 106, 79, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary-main);
            border: 2px solid var(--primary-main);
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            background: var(--primary-main);
            color: white;
        }

        .scan-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--primary-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .scan-link:hover { color: var(--primary-dark); }
        .demo-hint {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
        }

        /* Result Section */
        #result-container {
            margin-top: 3rem;
            width: 100%;
            max-width: 900px;
            display: none; /* Hidden initially */
        }

        .cert-preview {
            background: #fff;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border: 1px solid #ddd;
            position: relative;
            text-align: center;
            background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M0 100 V 50 Q 25 25 50 50 T 100 50 V 100 Z" fill="rgba(45, 106, 79, 0.03)"/></pattern></defs><rect width="100%" height="100%" fill="url(%23p)"/></svg>');
            background-size: cover;
            border: 15px solid var(--primary-dark);
            border-image: linear-gradient(45deg, var(--primary-dark), var(--primary-light)) 1;
            animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cert-logo {
            width: 80px;
            margin-bottom: 1rem;
        }
        .cert-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-dark);
            letter-spacing: 2px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }
        .cert-subtitle {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 1rem;
        }
        .cert-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-style: italic;
            color: var(--earth-2);
            margin-bottom: 1rem;
            border-bottom: 2px solid #eee;
            display: inline-block;
            padding: 0 2rem;
        }
        .cert-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 1rem;
        }
        .cert-course {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-main);
            font-weight: 700;
            margin-bottom: 3rem;
        }

        .cert-footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
            align-items: center;
        }
        .cert-col {
            text-align: center;
        }
        .cert-col .line {
            width: 80%;
            height: 1px;
            background: #999;
            margin: 0 auto 0.5rem;
        }
        .cert-col span {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cert-seal {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--earth-1), var(--earth-2));
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 4px dashed rgba(255,255,255,0.5);
        }

        .cert-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .error-state {
            background: #fff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            animation: shake 0.5s;
        }
        .error-state i {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1rem;
        }
        .error-state h3 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        /* Footer */
        footer {
            background: var(--primary-dark);
            color: var(--text-light);
            text-align: center;
            padding: 2rem;
            margin-top: auto;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10000;
        }
        .toast {
            background: white;
            color: var(--text-dark);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 4px solid var(--primary-main);
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--danger); }
        .toast.error i { color: var(--danger); }
        .toast i { color: var(--primary-main); font-size: 1.2rem; }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        /* Floating Leaves Background */
        .bg-leaves {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-leaves i {
            position: absolute;
            color: rgba(45, 106, 79, 0.05);
            font-size: 4rem;
            animation: float 20s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Page Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Background Decoration -->
    <div class="bg-leaves">
        <i class="fa-solid fa-leaf" style="left: 10%; animation-duration: 25s;"></i>
        <i class="fa-solid fa-leaf" style="left: 80%; animation-duration: 20s; font-size: 3rem;"></i>
        <i class="fa-brands fa-pagelines" style="left: 40%; animation-duration: 30s; font-size: 5rem;"></i>
    </div>

    <!-- Navbar -->
    <header>
        <a href="index.html" class="logo">
            <img src="../static/images/pics/logo.png" alt="Nature Club Logo" onerror="this.src='https://via.placeholder.com/150x45?text=Nature+Club'">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="verify-certificate.html">Verify</a></li>
            <li><a href="login.html" class="btn-nav">Login</a></li>
        </ul>
    </header>

    <main>
        <div class="hero">
            <h1>Verify Certificate</h1>
            <p>Enter a certificate number to verify its authenticity</p>
        </div>

        <div class="search-card">
            <div class="input-group">
                <i class="fa-solid fa-certificate"></i>
                <input type="text" id="cert-input" class="search-input" placeholder="Enter Certificate Number (e.g. KARU-2024-001)" autocomplete="off">
            </div>
            <button id="verify-btn" class="btn-primary">
                <i class="fa-solid fa-magnifying-glass"></i> Verify Now
            </button>
            <a href="#" class="scan-link"><i class="fa-solid fa-qrcode"></i> or scan QR code</a>
            <p class="demo-hint">Try <strong>KARU-2024-001</strong> for a demo certificate</p>
        </div>

        <div id="result-container">
            <!-- Content generated by JS -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Karatina University Nature Club LMS. All rights reserved.</p>
    </footer>

    <div class="toast-container" id="toast-container"></div>

    <!-- External JS -->
    <script src="js/main.js"></script>
    <script>
        // Loader removal
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        // Toast functionality
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Verification Logic
        document.getElementById('verify-btn').addEventListener('click', function() {
            const input = document.getElementById('cert-input').value.trim();
            const resultContainer = document.getElementById('result-container');
            const btn = this;
            
            if(!input) {
                showToast('Please enter a certificate number', 'error');
                return;
            }

            // Simulate loading
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            btn.style.pointerEvents = 'none';
            resultContainer.style.display = 'none';

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
                resultContainer.style.display = 'block';

                if(input.toUpperCase() === 'KARU-2024-001') {
                    showToast('Certificate Verified Successfully');
                    resultContainer.innerHTML = `
                        <div class="cert-preview">
                            <img src="../static/images/pics/logo.png" alt="Logo" class="cert-logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
                            <h2 class="cert-title">Certificate of Completion</h2>
                            <p class="cert-subtitle">This is to certify that</p>
                            <h1 class="cert-name">John Kamau</h1>
                            <p class="cert-text">has successfully completed the course</p>
                            <h3 class="cert-course">Graphic Design Pro</h3>
                            
                            <div class="cert-footer">
                                <div class="cert-col">
                                    <div class="line"></div>
                                    <span>Date Issued<br><b>Jan 15 2024</b></span>
                                </div>
                                <div class="cert-col">
                                    <div class="cert-seal">
                                        <i class="fa-solid fa-award"></i>
                                    </div>
                                </div>
                                <div class="cert-col">
                                    <div class="line"></div>
                                    <span>Instructor<br><b>Star Wanjiru</b></span>
                                </div>
                            </div>
                            <div style="margin-top: 1rem; color: #777; font-size: 0.85rem;">
                                Certificate No: KARU-2024-001
                            </div>
                        </div>
                        <div class="cert-actions">
                            <button class="btn-primary" onclick="window.print()"><i class="fa-solid fa-download"></i> Download PDF</button>
                            <button class="btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
                        </div>
                    `;
                    // Smooth scroll
                    resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    showToast('Invalid Certificate Number', 'error');
                    resultContainer.innerHTML = `
                        <div class="error-state">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <h3>Certificate Not Found</h3>
                            <p>We couldn't find a certificate matching the number "${input}". Please check the number and try again.</p>
                        </div>
                    `;
                }
            }, 1000);
        });

        // Trigger on enter key
        document.getElementById('cert-input').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                document.getElementById('verify-btn').click();
            }
        });
    </script>
</body>
</html>
